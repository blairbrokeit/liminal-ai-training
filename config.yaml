model:
  base: "./models/llama-3.1-8b-q4"
  adapter_rank: 32
  adapter_alpha: 64
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  learning_rate: 5.0e-5
  batch_size: 4
  max_pairs_per_session: 64
  dpo_beta: 0.1
  save_every: 10
  gradient_accumulation_steps: 2
  warmup_steps: 10
  max_length: 512

judge:
  # Single-judge mode (backwards compatible). Just set `model:` and you're done.
  model: "gpt-4o-mini"
  threshold: 0.7
  # Multi-judge ensemble mode. Uncomment to enable. When `ensemble:` is set, `model:`
  # above is ignored. `vote: majority` (default) requires >50% weighted agreement;
  # `vote: unanimous` requires every judge to agree the response was correct.
  # ensemble:
  #   - provider: openai
  #     model: gpt-4o-mini
  #     weight: 1.0
  #   - provider: anthropic
  #     model: claude-haiku-4-5-20251001
  #     weight: 1.0
  # vote: majority
  system_prompt: >
    You are a judge. Evaluate if the model's response is correct, honest, and complete.
    Return a JSON object with:
    - "correct": true/false
    - "confidence": 0.0-1.0
    - "reason": why the response is right or wrong
    - "category": what kind of mistake (hallucination, factual_error, incomplete, unsafe, none)
    Return ONLY the JSON object.

benchmarks:
  # Standard benchmarks to run during --benchmark. The custom task set is always
  # used for the per-loop curriculum; these are extra and only run before/after.
  truthfulqa:
    enabled: false
    limit: 200
  mmlu:
    enabled: false
    limit: 500
  gsm8k:
    enabled: false
    limit: 500
  humaneval:
    enabled: false
    limit: 164
    timeout: 10  # seconds per test case

npc:
  model: "gpt-4o-mini"
  max_interactions: 8
  temperature: 0.9

environment:
  max_steps: 50
  timeout: 300

curriculum:
  val_split: 0.2
  seed: 42
